:root{--bg:#faf8f3;--ink:#1f2a24;--muted:#5d6b63;--green:#2c5545;--gold:#d3a02f;--line:#cdd8cf}

html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Inter,system-ui,sans-serif}

.lang button{border:0;background:none;padding:5px 11px;font:500 .75rem Inter,sans-serif;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--green);color:#fff}
.hero{padding:64px 0 48px;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
@media(max-width:860px){.hero{grid-template-columns:1fr;gap:30px;padding:48px 0 36px}}
.shot{margin:0}
.shot img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.eyebrow{font-size:.85rem;color:var(--muted);margin:0 0 14px}
h1{font:300 clamp(2.4rem,6vw,3.9rem)/1.06 Fraunces,serif;margin:0 0 22px}

.lead{font-size:1.1rem;max-width:620px;color:#34423a}

.btn.gold{background:var(--gold);color:#1f2a24}
.btn.line{border:1px solid var(--green);color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.stats div{padding:22px 18px 18px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font:400 2rem Fraunces,serif;color:var(--green)}
.stats span{font-size:.85rem;color:var(--muted)}
section{padding:64px 0;border-bottom:1px solid var(--line)}
h2{font:300 2.1rem/1.15 Fraunces,serif;margin:0 0 20px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media(max-width:760px){.cols{grid-template-columns:1fr;gap:28px}nav a{display:none}}
ul.ticks{list-style:none;padding:0;margin:0;columns:2;column-gap:28px}
@media(max-width:520px){ul.ticks{columns:1}}
ul.ticks li{padding:4px 0 4px 24px;position:relative;break-inside:avoid}
ul.ticks li:before{content:"";position:absolute;left:0;top:13px;width:10px;height:2px;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
